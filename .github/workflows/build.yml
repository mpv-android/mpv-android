name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Reclaim native-build disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/ndk-bundle"
          df -h /

      - name: Export env vars
        run: buildscripts/include/ci.sh export >>$GITHUB_ENV

      - uses: actions/cache@v5
        with:
          path: gh-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"
          enableCrossOsArchive: true

      - name: Install packages
        run: |
          for source in /etc/apt/sources.list.d/*; do
            if sudo grep -q 'packages.microsoft.com' "$source"; then
              sudo rm -f "$source"
            fi
          done
          sudo apt-get update
          sudo apt-get install autoconf pkgconf libtool ninja-build python3-pip gperf unzip
          sudo pip3 install --break-system-packages meson==1.11.2

      - name: Download or build deps
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: "folder"
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Build
        run: |
          buildscripts/include/ci.sh build

      - name: Verify dual-ABI AAR
        run: buildscripts/include/verify-aar.sh

      - uses: actions/upload-artifact@v7
        with:
          name: mpv-android
          path: |
            libmpv-android/build/outputs/aar/libmpv-android-release.aar
            libmpv-android/build/outputs/aar/libmpv-android-release.aar.sha256
            app/build/outputs/apk/default/debug/app-default-universal-debug.apk
